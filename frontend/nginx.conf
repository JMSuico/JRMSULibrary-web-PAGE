server {
    listen 80;
    server_name _;
    # Docker Internal DNS Resolver for zero-downtime deployments
    resolver 127.0.0.11 valid=5s;

    # Basic WAF (Web Application Firewall) - Block bad bots & vulnerability scanners
    if ($http_user_agent ~* (nikto|nmap|sqlmap|zgrab|masscan|censys|shodan|acunetix|dirbuster)) {
        return 403;
    }

    # Advanced WAF - Deep URI Scanning
    # Block SQL Injection patterns (e.g. UNION SELECT, OR 1=1, pg_sleep)
    if ($request_uri ~* "(union.*select|waitfor.*delay|pg_sleep|or\s+1=1|or\s+1=0|cast\(.*as.*varchar|convert\(.*varchar)") {
        return 403;
    }
    # Block Cross-Site Scripting (XSS) payload attempts in URI
    if ($request_uri ~* "(<script|%3Cscript|javascript:|onerror=|onload=|alert\()") {
        return 403;
    }

    # Block dotfiles / hidden files (.htpasswd, .bash_history, .git, .env, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block probe attempts for foreign scripts, exploit paths, archive dumps, source maps, certs & sensitive files (with or without trailing slashes)
    location ~* (\.(jsp|php|asp|aspx|do|action|cgi|inc|bak|old|conf|sql|zip|tar|tgz|gz|bz2|lzma|egg|war|pem|cer|crt|jks|key|map)(/.*)?$|wp-admin|wp-login|xmlrpc\.php|/(package\.json|docker-compose\.yml|docker-compose\.yaml|Dockerfile|tsconfig\.json|yarn\.lock|passwd|shadow)$) {
        deny all;
        return 404;
    }

    # Comprehensive Security Headers (Applied to all static/root responses)
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://page.jrmsukc-library.online https://admin.jrmsukc-library.online https://*.jrmsukc-library.online https://jrmsukc-library.online wss://*.jrmsukc-library.online wss://jrmsukc-library.online https://*.jrmsukclibrary.com https://jrmsukclibrary.com wss://*.jrmsukclibrary.com wss://jrmsukclibrary.com; frame-src 'self' blob: https://maps.google.com https://www.google.com https://*.google.com https://*.googleapis.com https://*.openstreetmap.org https://www.facebook.com https://web.facebook.com https://*.vitalsource.com https://scholaar.com https://*.scholaar.com https://jrmsu.edu.ph https://*.jrmsu.edu.ph https://jrmsukc-library.online https://*.jrmsukc-library.online https://jrmsukclibrary.com https://*.jrmsukclibrary.com; frame-ancestors 'self'; object-src 'self' blob:; worker-src 'self' blob:; base-uri 'self'; form-action 'self';" always;
    
    # Allow larger file uploads (up to 25MB)
    client_max_body_size 25M;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Serve static eBooks if bundled in dist, otherwise stream seamlessly via backend /media/e_resources/eBooks/
    location ^~ /assets/eBooks/ {
        try_files $uri @ebooks_backend;
    }

    location @ebooks_backend {
        set $ebooks_backend http://backend:8000;
        rewrite ^/assets/eBooks/(.*)$ /media/e_resources/eBooks/$1 break;
        proxy_pass $ebooks_backend;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # Cache static assets aggressively (repeat server security headers because Nginx location add_header replaces parent level)
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://page.jrmsukc-library.online https://admin.jrmsukc-library.online https://*.jrmsukc-library.online https://jrmsukc-library.online wss://*.jrmsukc-library.online wss://jrmsukc-library.online https://*.jrmsukclibrary.com https://jrmsukclibrary.com wss://*.jrmsukclibrary.com wss://jrmsukclibrary.com; frame-src 'self' blob: https://maps.google.com https://www.google.com https://*.google.com https://*.googleapis.com https://*.openstreetmap.org https://www.facebook.com https://web.facebook.com https://*.vitalsource.com https://scholaar.com https://*.scholaar.com https://jrmsu.edu.ph https://*.jrmsu.edu.ph https://jrmsukc-library.online https://*.jrmsukc-library.online https://jrmsukclibrary.com https://*.jrmsukclibrary.com; frame-ancestors 'self'; object-src 'self' blob:; worker-src 'self' blob:; base-uri 'self'; form-action 'self';" always;
        try_files $uri =404;
    }

    # SPA fallback - all routes serve index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dedicated unbuffered AI streaming proxy (prevents SSE/LLM buffering and premature timeouts)
    location ^~ /api/ai/ {
        set $api_backend http://backend:8000;
        proxy_pass $api_backend$request_uri;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Proxy /api requests to the backend to solve CORS & Cookie SameSite issues on mobile/cross-device
    location ^~ /api/ {
        # Use a variable for proxy_pass so Nginx re-resolves the IP if a backend replica restarts
        set $api_backend http://backend:8000;
        proxy_pass $api_backend$request_uri;
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # Proxy WebSockets for Django Channels
    location ^~ /ws/ {
        set $ws_backend http://backend:8000;
        proxy_pass $ws_backend$request_uri;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Proxy /media requests to the backend so uploaded images and documents stream cleanly
    location ^~ /media/ {
        set $media_backend http://backend:8000;
        proxy_pass $media_backend$request_uri;
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}
