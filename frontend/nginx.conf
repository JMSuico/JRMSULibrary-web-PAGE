# Define a rate limit zone in the http context (10 requests per second per IP)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Connection limiting (DDoS protection against Slowloris)
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name _;
    # Docker Internal DNS Resolver for zero-downtime deployments
    resolver 127.0.0.11 valid=5s;

    # Enforce connection limits (max 200 concurrent connections per IP for campus NAT)
    limit_conn conn_limit 200;

    # Basic WAF (Web Application Firewall) - Block bad bots & vulnerability scanners
    if ($http_user_agent ~* (nikto|nmap|sqlmap|zgrab|masscan|censys|shodan|acunetix|dirbuster)) {
        return 403;
    }

    # Advanced WAF - Deep URI Scanning
    # Block SQL Injection patterns (e.g. UNION SELECT, OR 1=1, pg_sleep)
    if ($request_uri ~* "(union.*select|waitfor.*delay|pg_sleep|or\s+1=1|or\s+1=0|cast\(.*as.*varchar|convert\(.*varchar)") {
        return 403;
    }
    # Block Cross-Site Scripting (XSS) payload attempts in URI
    if ($request_uri ~* "(<script|%3Cscript|javascript:|onerror=|onload=|alert\()") {
        return 403;
    }

    # Block all hidden files (dotfiles) to prevent exposure of .htpasswd, .bash_history, etc.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block suspicious exploits and snooping attempts (including fake server-side scripts)
    location ~* (\.git|\.env|\.sql|\.bak|\.zip|\.tar|wp-admin|wp-login|xmlrpc\.php|\.php$|\.jsp$|\.asp$|\.aspx$|\.cgi$|\.pl$|\.ini$|\.sh$|\.bat$) {
        deny all;
        return 404;
    }

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data: https: http:; connect-src 'self' ws: wss: https: http:;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    
    # Allow larger file uploads (up to 25MB)
    client_max_body_size 25M;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback - all routes serve index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api requests to the backend to solve CORS & Cookie SameSite issues on mobile/cross-device
    location /api/ {
        # Nginx-level Rate Limiting: 10 req/s per IP, burst up to 100 without delaying (allows rapid campus requests)
        limit_req zone=api_limit burst=100 nodelay;
        
        # Use a variable for proxy_pass so Nginx re-resolves the IP if a backend replica restarts
        set $api_backend http://backend:8000;
        proxy_pass $api_backend$request_uri;
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy WebSockets for Django Channels
    location /ws/ {
        set $ws_backend http://backend:8000;
        proxy_pass $ws_backend/ws/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Proxy /media requests to the backend so uploaded images load correctly
    location ^~ /media/ {
        set $media_backend http://backend:8000;
        proxy_pass $media_backend$request_uri;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
