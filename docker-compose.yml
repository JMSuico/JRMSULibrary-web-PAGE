services:

  # ─── Layer 4: Database ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jrmsu_library
      POSTGRES_USER: jrmsu_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jrmsu_admin -d jrmsu_library"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Layer 3: Backend ──────────────────────────────────────────────────
  backend:
    deploy:
      replicas: 3
    build:
      context: ./backend
      dockerfile: Dockerfile
    pull_policy: never
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_ENGINE: postgresql
      DB_NAME: jrmsu_library
      DB_USER: jrmsu_admin
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      DISABLE_SSL_REDIRECT: "True"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-*}"
      # ---> ADD YOUR LAPTOP'S WI-FI IP ADDRESS HERE <---
      # To allow other devices (like phones) on the library WiFi to connect,
      # find your laptop's IPv4 address (e.g., 192.168.1.50) using `ipconfig`.
      # Then, add http://<YOUR_IP>:3000 and http://<YOUR_IP>:3001 to this list!
      ALLOWED_CORS_ORIGINS: "${ALLOWED_CORS_ORIGINS:-*}"
      OLLAMA_URL: "http://ollama:11434/api/chat"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      REDIS_CACHE_URL: "redis://:${REDIS_PASSWORD}@redis:6379/1"
      USE_REDIS: "True"
      # SMTP — Gmail App Password
      EMAIL_HOST: "smtp.gmail.com"
      EMAIL_PORT: "587"
      EMAIL_HOST_USER: "katipunan.library@jrmsu.edu.ph"
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: "JRMSU-KC Library <katipunan.library@jrmsu.edu.ph>"
      # External library credentials
      VITALSOURCE_EMAIL: ${VITALSOURCE_EMAIL}
      VITALSOURCE_PASSWORD: ${VITALSOURCE_PASSWORD}
      SCHOLAAR_USERNAME: ${SCHOLAAR_USERNAME}
      SCHOLAAR_PASSWORD: ${SCHOLAAR_PASSWORD}
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
      - ./frontend/src/Assets/assets:/app/frontend_assets:ro
      - "./frontend/src/Assets/FAQ cache:/frontend/src/Assets/FAQ cache"
    # Auto-run migrations on every startup — ensures fresh clones work immediately
    command: >
      sh -c "python manage.py migrate --noinput &&
             daphne -b 0.0.0.0 -p 8000 core.asgi:application"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    pull_policy: never
    restart: unless-stopped
    command: celery -A core worker -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_ENGINE: postgresql
      DB_NAME: jrmsu_library
      DB_USER: jrmsu_admin
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      REDIS_CACHE_URL: "redis://:${REDIS_PASSWORD}@redis:6379/1"
      USE_REDIS: "True"
      USE_CELERY: "True"
      EMAIL_HOST: "smtp.gmail.com"
      EMAIL_PORT: "587"
      EMAIL_HOST_USER: "katipunan.library@jrmsu.edu.ph"
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: "JRMSU-KC Library <katipunan.library@jrmsu.edu.ph>"
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media

  # ─── Layer 1: Frontend Webpage (Public Landing Page) ───────────────────
  frontend-webpage:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  # ─── Layer 2: Frontend Admin Page ──────────────────────────────────────
  frontend-admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:80"

  # ─── Layer 5: Model AI ─────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  # ─── Layer 5 Init: Auto-pull Qwen Model ────────────────────────────────
  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      - ollama
    entrypoint: ["sh", "-c", "sleep 10 && ollama pull qwen3:0.6b"]
    environment:
      - OLLAMA_HOST=ollama:11434

  # ─── Layer 6: Ngrok Tunnel (Public URL) ────────────────────────────────
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    depends_on:
      - frontend-webpage
    environment:
      # TODO: Paste your actual Ngrok authtoken here from ngrok.com
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "frontend-webpage:80"
    ports:
      - "4040:4040"


volumes:
  db_data:
  ollama_data: