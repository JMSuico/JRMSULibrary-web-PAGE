# ==============================================================================
# JRMSU Library System — Hardened Permanent Production Docker Compose (NO NGROK)
# ==============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Ports exposed on Host:
#   - 3000:80  -> Public Landing Page (Students)
#   - 3001:80  -> Secure Admin Dashboard (Librarians)
#   - 8000     -> Internal ASGI / Django API (proxied via container Nginx)
# ==============================================================================

services:

  # ─── Layer 4: Database (PostgreSQL 16) ─────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    command: postgres -c wal_level=replica -c max_wal_senders=10 -c max_replication_slots=10 -c wal_keep_size=128MB -c hot_standby=on
    environment:
      POSTGRES_DB: jrmsu_library
      POSTGRES_USER: jrmsu_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jrmsu_admin -d jrmsu_library"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Layer 4-B: Local Hot Standby Database (Streaming Replica) ────────────────
  db-standby:
    image: postgres:16-alpine
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: jrmsu_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - db_standby_data:/var/lib/postgresql/data
    entrypoint:
      - "sh"
      - "-c"
      - |
        until pg_isready -h db -U jrmsu_admin -d jrmsu_library; do
          echo 'Waiting for primary db to be ready...'
          sleep 2
        done
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo 'Cloning base backup from primary db...'
          pg_basebackup -h db -U jrmsu_admin -D /var/lib/postgresql/data -Fp -Xs -P -R
        fi
        echo 'Starting PostgreSQL in standby streaming mode...'
        exec postgres -c hot_standby=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jrmsu_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Layer 6: In-Memory Cache & Message Broker (Redis 7) ───────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Layer 3: Backend API (Django + Daphne ASGI) ───────────────────────────
  backend:
    deploy:
      replicas: 3
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_ENGINE: postgresql
      DB_NAME: jrmsu_library
      DB_USER: jrmsu_admin
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      DISABLE_SSL_REDIRECT: "${DISABLE_SSL_REDIRECT:-False}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-*}"
      ALLOWED_CORS_ORIGINS: "${ALLOWED_CORS_ORIGINS:-*}"
      OLLAMA_URL: "http://ollama:11434/api/chat"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      REDIS_CACHE_URL: "redis://:${REDIS_PASSWORD}@redis:6379/1"
      USE_REDIS: "True"
      WEB_CONCURRENCY: 3
      EMAIL_HOST: "smtp.gmail.com"
      EMAIL_PORT: "587"
      EMAIL_HOST_USER: "katipunan.library@jrmsu.edu.ph"
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: "JRMSU-KC Library <katipunan.library@jrmsu.edu.ph>"
      VITALSOURCE_EMAIL: ${VITALSOURCE_EMAIL}
      VITALSOURCE_PASSWORD: ${VITALSOURCE_PASSWORD}
      SCHOLAAR_USERNAME: ${SCHOLAAR_USERNAME}
      SCHOLAAR_PASSWORD: ${SCHOLAAR_PASSWORD}
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
      - ./frontend/src/Assets/assets:/app/frontend_assets:ro
      - "./frontend/src/Assets/FAQ cache:/frontend/src/Assets/FAQ cache"
    command: >
      sh -c "python manage.py migrate --noinput &&
             daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── Layer 7: Celery Background Task Worker ────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: celery -A core worker -l info --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_ENGINE: postgresql
      DB_NAME: jrmsu_library
      DB_USER: jrmsu_admin
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      REDIS_CACHE_URL: "redis://:${REDIS_PASSWORD}@redis:6379/1"
      USE_REDIS: "True"
      USE_CELERY: "True"
      EMAIL_HOST: "smtp.gmail.com"
      EMAIL_PORT: "587"
      EMAIL_HOST_USER: "katipunan.library@jrmsu.edu.ph"
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: "JRMSU-KC Library <katipunan.library@jrmsu.edu.ph>"
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Layer 1: Frontend Webpage (Public Landing Page) ───────────────────────
  frontend-webpage:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_MODE: webpage
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Layer 2: Frontend Admin Page (Librarian Dashboard) ───────────────────
  frontend-admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_MODE: admin
    restart: always
    depends_on:
      - backend
    ports:
      - "3001:80"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Layer 5: Model AI (Local Ollama Engine) ──────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Layer 5 Init: Auto-pull Qwen Model on Startup ────────────────────────
  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      - ollama
    entrypoint: ["sh", "-c", "sleep 10 && ollama pull qwen3:0.6b"]
    environment:
      - OLLAMA_HOST=ollama:11434

volumes:
  db_data:
  db_standby_data:
  redis_data:
  ollama_data:
